server.port=8080

# Spring Application Name
spring.application.name=horse-race-backend

# Datasource Setup (Defaults to H2 in-memory MySQL compatibility mode for instant setup; configurable via ENV for MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:horserace_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JWT Configuration Secret & Expiration (24 Hours)
app.jwt-secret=9a2f8c4e7b1d3a5f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a
app.jwt-expiration-milliseconds=86400000

# Jackson JSON Settings
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

